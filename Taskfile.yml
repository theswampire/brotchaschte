version: "3"

vars:
  ALLOWED_FRONTEND: [ bundle, proxy ]
  EXECUTABLE_FILE: main

tasks:
  default:
    cmds:
      - task: dev

  install-deps-frontend:
    dir: frontend
    run: once
    cmds:
      - pnpm install --frozen-lockfile
    

  build-frontend:
    deps: [ install-deps-frontend ]
    dir: frontend
    cmds:
      - pnpm build

  serve-frontend:
    desc: Watch and serve frontend
    dir: frontend
    cmds:
      - pnpm dev



  build-backend:
    requires:
      vars:
        - name: BUILD_FLAGS
    env:
      CGO_ENABLED: 1
      #GOOS: linux
    cmds:
      - sqlc generate
      - go build -o {{.EXECUTABLE_FILE}} {{.BUILD_FLAGS}} cmd/server/main.go
    generates:
      - '{{.EXECUTABLE_FILE}}'

  build-bundled-backend:
    internal: true
    cmds:
      - task: build-backend
        vars: { BUILD_FLAGS: "--tags=bundle" }

  build-proxied-backend:
    internal: true
    cmds:
      - task: build-backend
        vars: { BUILD_FLAGS: "" }

  _build-backend:
    requires:
      vars:
        - name: FRONTEND
          enum: 
            ref: .ALLOWED_FRONTEND
    vars:
      FRONTEND: '{{default "not defined" .FRONTEND}}'
    cmds:
      - task: build-bundled-backend
        if: '{{ eq .FRONTEND "bundle" }}'
      - task: build-proxied-backend
        if: '{{ eq .FRONTEND "proxy" }}'


  build:
    desc: Build backend in bundled mode
    deps: [ build-frontend ] 
    cmds:
      - task: _build-backend
        vars: { FRONTEND: 'bundle' }


  build-dev:
    desc: Build backend in proxy mode
    cmds:
      - task: _build-backend
        vars: { FRONTEND: 'proxy' }
        

  run-dev:
    desc: Runs backend after building in proxy mode
    deps: [ build-dev ]
    cmds:
      - ./{{.EXECUTABLE_FILE}}



  watch:
    desc: Watch backend
    cmds:
      - air

  dev:
    desc: Run and watch both backend and frontend 
    deps: [ watch, serve-frontend ]
    cmds:
      - echo "done"

  test:
    desc: Test code
    cmds:
      - go test ./... -v

  clean:
    cmds:
      - rm -f main
      - rm -rf frontend/dist
      - rm -rf tmp

