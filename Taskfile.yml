version: "3"

vars:
  ALLOWED_FRONTEND: [ bundle, proxy ]
  EXECUTABLE_FILE: main

tasks:
  default:
    cmds:
      - task: dev

  #### Requirements checks ###

  _check_cmd:
    requires:
      vars:
        - name: tool_cmd 
    cmds:
      - defer:
          echo '{{if .EXIT_CODE}}{{.tool_cmd}} is not installed{{else}}{{.tool_cmd}} is installed{{end}}'
      - command -v {{.tool_cmd}}

  check-zig-installed:
    once: true
    cmds:
      - task: _check_cmd
        vars: { tool_cmd: zig }

  check-build-tools-installed:
    once: true
    cmds:
      - task: _check_cmd
        vars: { tool_cmd: go }
      - task: _check_cmd
        vars: { tool_cmd: sqlc }
      - task: _check_cmd
        vars: { tool_cmd: pnpm }

  check-dev-tools-installed:
    once: true
    cmds:
      - task: _check_cmd
        vars: { tool_cmd: air }


  ### Frontend ###

  install-deps-frontend:
    dir: frontend
    run: once
    cmds:
      - pnpm install --frozen-lockfile 


  build-frontend:
    deps: [ install-deps-frontend ]
    dir: frontend
    cmds:
      - pnpm build

  serve-frontend:
    desc: Watch and serve frontend
    dir: frontend
    cmds:
      - pnpm dev


  ### Backend ###

  build-backend:
    requires:
      vars:
        - name: BUILD_FLAGS
    env:
      CGO_ENABLED: 1
      CC: '{{.CC}}' 
      GOOS: '{{.GOOS}}'  
      GOARCH: '{{.GOARCH}}'  
    cmds:
      - sqlc generate
      - CC="{{.CC}}" go build -o {{.EXECUTABLE_FILE}} {{.BUILD_FLAGS}} cmd/server/main.go
    generates:
      - '{{.EXECUTABLE_FILE}}'

  build-bundled-backend:
    internal: true
    cmds:
      - task: build-backend
        vars:
          BUILD_FLAGS: '--tags=bundle'
          CC: '{{.CC}}' 
          GOOS: '{{.GOOS}}'  
          GOARCH: '{{.GOARCH}}'  

  build-proxied-backend:
    internal: true
    cmds:
      - task: build-backend
        vars: 
          BUILD_FLAGS: "" 
          CC: '{{.CC}}' 
          GOOS: '{{.GOOS}}'  
          GOARCH: '{{.GOARCH}}'  

  _build-backend:
    requires:
      vars:
        - name: FRONTEND
          enum: 
            ref: .ALLOWED_FRONTEND
    vars:
      FRONTEND: '{{default "not defined" .FRONTEND}}'
    cmds:
      - task: build-bundled-backend
        if: '{{ eq .FRONTEND "bundle" }}'
        vars:
          CC: '{{.CC}}' 
          GOOS: '{{.GOOS}}'  
          GOARCH: '{{.GOARCH}}'  
      - task: build-proxied-backend
        if: '{{ eq .FRONTEND "proxy" }}'
        vars:
          CC: '{{.CC}}' 
          GOOS: '{{.GOOS}}'  
          GOARCH: '{{.GOARCH}}'  

  ### General Tasks ###

  build:
    desc: Build backend in bundled mode
    deps: [ check-build-tools-installed, build-frontend ] 
    failfast: true
    cmds:
      - task: _build-backend
        vars: { FRONTEND: 'bundle' }


  build-arm:
    desc: Build backend in bundled mode for Arm
    deps: [ check-build-tools-installed, check-zig-installed, build-frontend ] 
    failfast: true
    cmds:
      - task: _build-backend
        vars: 
          FRONTEND: 'bundle' 
          CC: 'zig cc -target aarch64-linux-musl' 
          GOOS: linux
          GOARCH: arm64 

  build-dev:
    desc: Build backend in proxy mode
    cmds:
      - task: _build-backend
        vars: { FRONTEND: 'proxy' }
        

  run-dev:
    desc: Runs backend after building in proxy mode
    deps: [ build-dev ]
    cmds:
      - ./{{.EXECUTABLE_FILE}}



  watch:
    desc: Watch backend
    deps: [ check-dev-tools-installed ]
    cmds:
      - air

  dev:
    desc: Run and watch both backend and frontend 
    deps: [ watch, serve-frontend ]
    cmds:
      - echo "done"

  test:
    desc: Test code
    cmds:
      - go test ./... -v

  clean:
    cmds:
      - rm -f main
      - rm -rf frontend/dist
      - rm -rf tmp

